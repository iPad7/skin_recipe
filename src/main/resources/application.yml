spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mycosmetic?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:skin-recipe-default-secret-key-must-be-at-least-32-chars}
  expiration: 86400000  # 24시간 (ms)

upstage:
  api-key: ${UPSTAGE_API_KEY:test-api-key}
  model:
    llm: solar-pro3-260323
    document-parse: document-parse-260128
    embedding: solar-embedding-1-large

file:
  upload-dir: ./uploads
